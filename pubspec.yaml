name: tradexa
description: Institutional trading insights MVP - candles + order blocks + FVG + liquidity sweeps
publish_to: 'none'
version: 0.1.0+1
 
environment:
  sdk: ">=3.0.0 <4.0.0"
 
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  intl: ^0.19.0
  http: ^1.2.0
  shared_preferences: ^2.3.0
  otp: ^3.1.3
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.8
  crypto: ^3.0.6
 
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
 
flutter:
  uses-material-design: true
  assets:
    - assets/splash_screen/tradexe_logo.png
    - assets/logo/Tradexa no background.png
 
